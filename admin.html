<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Portfolio Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            /* CSS o'zgaruvchilarini e'lon qilish (validator xatolarini yo'qotish uchun) */
            --primary: #7C3AED;
            --secondary: #06B6D4;
            --muted: #9090A8;
            --border: rgba(255, 255, 255, 0.1);
            --grad: linear-gradient(135deg, #7C3AED, #06B6D4);
            background: #0A0A0F;
            padding: 2rem 2rem 2rem 280px;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
        }

        .admin-container {
            flex: 1;
            max-width: 1000px;
            background: #1A1A24;
            padding: 2.5rem;
            border-radius: 24px;
            border: 1px solid rgba(124, 58, 237, 0.2);
        }

        .admin-header {
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 1rem;
        }

        .admin-section {
            margin-bottom: 3rem;
            background: rgba(255, 255, 255, 0.03);
            padding: 1.5rem;
            border-radius: 16px;
        }

        .admin-section h3 {
            font-family: 'Syne', sans-serif;
            margin-bottom: 1.5rem;
            color: var(--secondary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .input-group {
            margin-bottom: 1rem;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--muted);
            margin-bottom: 5px;
        }

        .input-group input,
        .input-group textarea {
            width: 100%;
            background: #111118;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.8rem;
            border-radius: 10px;
            color: white;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--primary);
        }

        .btn-save {
            background: var(--grad);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            margin-top: 1rem;
        }

        .item-list {
            margin-top: 1rem;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .list-item {
            background: #111118;
            padding: 10px 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .btn-delete {
            color: #EF4444;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
        }

        .btn-add {
            background: rgba(34, 197, 94, 0.1);
            color: #22C55E;
            border: 1px dashed #22C55E;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        /* Sidebar Navigation override for admin */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: auto;
            width: 260px;
            height: 100vh;
            padding: 3rem 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            background: rgba(10, 10, 15, 0.95);
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--border);
            border-bottom: none;
            z-index: 1000;
        }

        .logo {
            margin-bottom: 3rem;
        }

        .nav-links {
            flex-direction: column;
            gap: 1.5rem;
            width: 100%;
            text-align: left;
        }

        .nav-links li {
            width: 100%;
        }

        .nav-links a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            border-radius: 12px;
            transition: 0.3s;
            color: var(--muted);
            text-decoration: none;
            border: 1px solid transparent;
        }

        .nav-links a:hover,
        .nav-links a.active {
            background: rgba(124, 58, 237, 0.1);
            color: white;
            border-color: rgba(124, 58, 237, 0.3);
        }

        .btn-logout {
            margin-top: auto;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 0.8rem;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--border);
        }

        .btn-logout:hover {
            background: rgba(239, 68, 68, 0.1);
            color: #EF4444;
            border-color: #EF4444;
            transform: translateY(-2px);
        }

        /* Specific style for admAbout textarea */
        #admAbout {
            width: 100%;
            background: #111118;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.8rem;
            border-radius: 10px;
            color: white;
        }

        @media(max-width:992px) {
            body {
                padding-left: 1.5rem;
            }

            nav {
                display: none;
            }

            .admin-container {
                margin: 0 auto;
            }
        }
    </style>
</head>

<body>
    <nav>
        <div class="logo">ADMIN</div>
        <ul class="nav-links">
            <li><a href="admin.html" class="active"><i
                        class="bi bi-person-badge"></i> Ma'lumotlar</a></li>
            <li><a href="admin-projects.html"><i class="bi bi-kanban"></i> Loyihalar</a></li>
            <li><a href="admin-skills.html"><i class="bi bi-cpu"></i> Ko'nikmalar</a></li>
            <li><a href="admin-certs.html"><i class="bi bi-patch-check"></i> Sertifikatlar</a></li>
            <hr class="dropdown-hr" style="width: 100%; margin: 1rem 0; opacity: 0.1;">
            <li><a href="index.html"><i class="bi bi-arrow-left-circle"></i> Saytga qaytish</a></li>
        </ul>
        <button class="btn-outline btn-logout" onclick="logoutAdmin()">
            Chiqish <i class="bi bi-box-arrow-right"></i>
        </button>
    </nav>

    <div class="admin-container">
        <div class="admin-header">
            <h2>Boshqaruv Paneli</h2>
        </div>

        <!-- ASOSIY MA'LUMOTLAR -->
        <div class="admin-section" id="base-info">
            <h3><i class="bi bi-person-gear"></i> Asosiy Ma'lumotlar</h3>
            <div class="form-grid">
                <div class="input-group">
                    <label>To'liq Ism</label>
                    <input type="text" id="admName" name="fullName" autocomplete="name">
                </div>
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="admEmail" name="email" autocomplete="email">
                </div>
                <div class="input-group">
                    <label>Telegram Username</label>
                    <input type="text" id="admTg" name="telegram" autocomplete="off">
                </div>
                <div class="input-group">
                    <label>GitHub Username</label>
                    <input type="text" id="admGh" name="github" autocomplete="off">
                </div>
                 
                <div class="input-group">
                    <label>Mijozlar soni</label>
                    <input type="number" id="admClients" name="clients" autocomplete="off">
                </div>
            </div>
            <div class="input-group" style="margin-top: 1rem;">
                <label>Men haqimda (Bio)</label>
                <textarea id="admAbout" name="bio" rows="4" autocomplete="off"></textarea>
            </div>
        </div>

        <button class="btn-save" onclick="saveAllChanges()">BARCHA O'ZGARISHLARNI SAQLASH</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script>
        const supabaseUrl = "https://veofchirokvabudukbgi.supabase.co"
        const supabaseKey = "sb_publishable_RoeYWIVVOduHB7cyAEHG8Q_6LplkMUb"
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey)

        // Xavfsizlik: Admin emas bo'lsa kirishni taqiqlash
        if (localStorage.getItem('is_admin') !== 'true') {
            window.location.href = 'index.html';
        }

        let currentData = {};

        async function initAdmin() {
            const { data } = await supabase.from('portfolio').select('content').eq('id', 1).single();
            currentData = data?.content || { stats: {} };

            document.getElementById('admName').value = currentData.name || "";
            document.getElementById('admEmail').value = currentData.email || "";
            document.getElementById('admTg').value = currentData.telegram || "";
            document.getElementById('admGh').value = currentData.github || "";
            document.getElementById('admAbout').value = currentData.about || "";
            document.getElementById('admClients').value = currentData.stats?.clients || 0;
        }

        async function saveAllChanges() {
            currentData.name = document.getElementById('admName').value;
            currentData.email = document.getElementById('admEmail').value;
            currentData.telegram = document.getElementById('admTg').value;
            currentData.github = document.getElementById('admGh').value;
            currentData.about = document.getElementById('admAbout').value;
            if(!currentData.stats) currentData.stats = {};
            if(document.getElementById('admExp')) currentData.stats.exp = parseInt(document.getElementById('admExp').value) || 0;
            currentData.stats.clients = parseInt(document.getElementById('admClients').value) || 0;

            await supabase.from('portfolio').update({ content: currentData }).eq('id', 1);
            alert('Muvaffaqiyatli saqlandi! Sayt yangilandi.');
            window.location.href = 'index.html';
        }

        function logoutAdmin() {
            localStorage.removeItem('is_admin');
            window.location.href = 'index.html';
        }

        initAdmin();
    </script>
</body>

</html>
